[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[project]
name = "search"
version = "0.1.0"
description = "Seed Agglomerative and Recursive Clustering with Hypothesis-oriented initialisation (SEARCH): a single engine with the SEARCH 2014 and Buffa 2010 presets"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Gennaro Abbruzzese", email = "gennaro.abbruzzese@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "joblib>=1.4",
  "threadpoolctl>=3.5",
  "pyarrow>=16",
]

[project.optional-dependencies]
h5ad = ["anndata>=0.10", "h5py>=3.10"]
glm = ["statsmodels>=0.14"]
plots = ["matplotlib>=3.8", "networkx>=3.2"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-benchmark>=4",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
  "mkdocs-material>=9.5",
]

[project.scripts]
search = "search.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "W"]

[tool.mypy]
python_version = "3.12"
packages = ["search"]
mypy_path = "src"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "realdata: needs the GBM cohorts, found through SEARCH_GBM_DATA",
  "bench: performance benchmarks",
  "slow: slow tests",
]
